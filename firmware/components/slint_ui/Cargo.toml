[package]
name = "slint_ui"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
name = "slint_ui"
crate-type = ["staticlib"]

[workspace]

[dependencies]
# 界面在构建期由 slint-build 编译成 Rust；运行期只保留软件渲染器这条通路。
slint = { version = "1.18", default-features = false, features = [
    "compat-1-2",
    "renderer-software",
    "unsafe-single-threaded",
    "libm",
] }
libm = "0.2"

[build-dependencies]
slint-build = "1.18"

[profile.release]
opt-level = "z"
panic = "abort"

