# 屏幕 UI 工作区:界面源码(ui/src、ui/assets)与三份 Rust 包共用一份 Cargo.lock。
# host 是宿主侧用例包(stable 工具链),slint_ui 是交叉编译进固件的静态库(目录名同时是
# ESP-IDF 组件名,由 idf.py build 触发),build-support 是两份 build.rs 共用的编译口径。

[workspace]
resolver = "2"
members = ["host", "slint_ui", "build-support"]
# 日常命令(cargo test / build 不带 -p)只落在 host:slint_ui 是 no_std 固件包,
# 测试目标链 std 会与它的 panic handler 冲突;它只由 ui/slint_ui/CMakeLists.txt 显式构建。
default-members = ["host"]

# 三份包随界面源码采用 GPL-3.0-only:界面依赖的 Slint 以 GPL-3.0 授权(见 ui/LICENSE-GPL-3.0)。
[workspace.package]
license = "GPL-3.0-only"

# 只有 slint_ui 会以 release 构建:固件侧 no_std 静态库不做栈展开。
# host 用例走 dev/test profile 不受影响,但不要用 --release 跑用例。
[profile.release]
panic = "abort"

[profile.release.package.slint_ui]
opt-level = "z"
