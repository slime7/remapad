[package]
name = "slint_ui"
version = "0.1.0"
edition = "2021"
license.workspace = true
publish = false

# 固件侧界面包：构建期由 slint-build 编译成 Rust，交叉编译成 xtensa 静态库链进固件；
# 编译口径在 ../build-support，宿主用例包是同工作区的 ../host。

[lib]
name = "slint_ui"
crate-type = ["staticlib"]

[dependencies]
# 界面在构建期由 slint-build 编译成 Rust；运行期只保留软件渲染器这条通路。
slint = { version = "1.18", default-features = false, features = [
    "compat-1-2",
    "renderer-software",
    "unsafe-single-threaded",
    "libm",
] }
libm = "0.2"
# 行带计划与宿主用例共用一份实现（见 ui/render-plan 与 ui/host/tests/bands.rs）。
render-plan = { path = "../render-plan" }

[build-dependencies]
build-support = { path = "../build-support" }
